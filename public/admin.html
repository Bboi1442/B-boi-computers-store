<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B BOI Store Admin</title><style>
body{margin:0;background:#080d18;color:#f5f7fb;font:15px system-ui}.wrap{width:min(1000px,92%);margin:35px auto}input,button{padding:10px;border-radius:8px;border:1px solid #33445b;background:#111a2b;color:white}button{background:#a3f36b;color:#10200b;font-weight:800;cursor:pointer}.panel{background:#111a2b;border:1px solid #293951;border-radius:14px;padding:18px;margin:16px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{display:grid;grid-template-columns:1.2fr 1fr 130px 100px;gap:9px;align-items:center;border-top:1px solid #293951;padding:12px 0}.muted{color:#aab7ca;font-size:13px}@media(max-width:700px){.product,.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>B BOI COMPUTER'S — Admin</h1><p class="muted">Set your product prices in Naira and review orders. Keep this page private.</p><div class="panel"><label>Admin password <input id="pw" type="password" autocomplete="current-password"></label> <button onclick="loadAdmin()">Unlock dashboard</button><p id="status" class="muted"></p></div><div id="dashboard"></div></div>
<script>
let password="";const headers=()=>({"Content-Type":"application/json","x-admin-password":password});
async function loadAdmin(){password=document.getElementById("pw").value;const r=await fetch("/api/admin/orders",{headers:headers()});if(!r.ok){document.getElementById("status").textContent="Login failed. Check your admin password.";return;}document.getElementById("status").textContent="Dashboard unlocked.";const p=await fetch("/api/products");const products=await p.json();const all=await fetch("/api/admin/orders",{headers:headers()}).then(x=>x.json());document.getElementById("dashboard").innerHTML='<div class="panel"><h2>Manage catalog prices</h2><p class="muted">Enter prices in whole Naira (for example, 5000). Leave blank to make the item quote-only.</p>'+products.map(x=>`<div class="product"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category)}</div></div><input id="price-${x.id}" type="number" min="1" step="1" placeholder="Price in ₦" value="${x.priceKobo==null?"":x.priceKobo/100}"><label><input id="active-${x.id}" type="checkbox" ${x.active?"checked":""}> Active</label><button onclick="saveProduct('${x.id}')">Save</button></div>`).join("")+'</div><div class="panel"><h2>Orders</h2>'+(all.length?all.map(o=>`<div class="product"><div><b>${esc(o.name||o.email)}</b><div class="muted">${esc(o.reference)} · ${new Date(o.createdAt).toLocaleString()}</div></div><div>${esc(o.items.map(i=>i.name+" × "+i.quantity).join(", "))}</div><div>₦${(o.amountKobo/100).toLocaleString("en-NG")}<br><b>${esc(o.status)}</b></div><div>${esc(o.email)}</div></div>`).join(""):'<p class="muted">No orders yet.</p>')+'</div>';}
async function saveProduct(id){const price=document.getElementById("price-"+id).value;const r=await fetch("/api/admin/products/"+id,{method:"PUT",headers:headers(),body:JSON.stringify({priceNaira:price===""?null:Number(price),active:document.getElementById("active-"+id).checked})});const d=await r.json();alert(r.ok?"Product saved.":"Could not save: "+(d.error||"error"));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script></body></html>
